<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The OpenGraph card. Edit here, then: node scripts/make-og.mjs -->
<style>
  @font-face { font-family: 'Object Sans'; src: url('../public/fonts/PPObjectSans-Heavy.woff2') format('woff2'); font-weight: 800; font-style: normal; font-display: block; }
  @font-face { font-family: 'Object Sans'; src: url('../public/fonts/PPObjectSans-HeavySlanted.woff2') format('woff2'); font-weight: 800; font-style: italic; font-display: block; }
  @font-face { font-family: 'Neue Montreal'; src: url('../public/fonts/PPNeueMontreal-Book.woff2') format('woff2'); font-weight: 400; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #14112B; color: #FFFFFF;
         font-family: 'Neue Montreal', sans-serif; overflow: hidden; }
  .card { width: 100%; height: 100%; padding: 84px 96px; display: flex; flex-direction: column;
          justify-content: space-between; position: relative; }
  .mark { font-family: 'Object Sans', sans-serif; font-weight: 800; font-size: 168px;
          line-height: 0.9; letter-spacing: -0.045em; color: #C6F432; }
  .tag { font-family: 'Object Sans', sans-serif; font-weight: 800; font-size: 62px;
         line-height: 1.05; letter-spacing: -0.03em; color: #FFFFFF; }
  .tag em { font-style: italic; color: #FF6B2C; }
  .foot { display: flex; align-items: center; gap: 16px; font-size: 26px; color: #B6B1D6; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #3D3BF3; }
  .rule { position: absolute; left: 0; top: 0; width: 20px; height: 100%; background: #3D3BF3; }
</style>
</head>
<body>
  <div class="card">
    <div class="rule"></div>
    <div class="mark">Volly</div>
    <p class="tag">Volunteers <em>activated</em></p>
    <div class="foot"><span class="dot"></span><span>A Vloora product</span></div>
  </div>
</body>
</html>
