name = "voluntold"
main = "src/worker/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/v/*", "/t/*", "/u/*", "/join/*"]

[[d1_databases]]
binding = "DB"
database_name = "voluntold"
# Replace with the id from `wrangler d1 create voluntold`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
# Expire asks and mark work done when its time passes.
crons = ["*/15 * * * *"]

[vars]
# "1" turns on sign-in codes in the response, the sample data button and the
# test clock header. Never set it in production.
DEV_MODE = "0"
APP_URL = "http://localhost:8787"
# The record name for tasks posted to AT Protocol. It must sit under a domain
# the project owns, and it can't change once records exist. Posting stays off
# until it is set. See docs/decisions/0006-only-tasks-go-on-at-protocol.md.
ATPROTO_TASK_NSID = ""
# Who approves new organizations, comma-separated. Until approved, the tool
# sends no email for an organization.
ADMIN_EMAILS = ""

# The shareable demo. Sign-in codes appear on screen and the sample data button
# is on, so anyone with the link can sign in as anyone. Demo data only.
# Deploy it with scripts/deploy-demo.sh.
[env.demo]

[[env.demo.d1_databases]]
binding = "DB"
database_name = "voluntold-demo"
database_id = "f238db41-2d05-43c5-b7ac-49c7ce78ad72"
migrations_dir = "migrations"

[env.demo.vars]
DEV_MODE = "1"
APP_URL = "https://voluntold-demo.square-dawn-9932.workers.dev"
ATPROTO_TASK_NSID = ""

# The real product at manyarms.app: sign-up, accounts and email. Deploy with
# scripts/deploy-production.sh, following docs/launch/deploy.md. manyarms.app
# must be on the same Cloudflare account before the first deploy.
[env.production]
routes = [{ pattern = "manyarms.app", custom_domain = true }]

[env.production.triggers]
crons = ["*/15 * * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "manyarms"
# Replace with the id from `npx wrangler d1 create manyarms`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.production.vars]
DEV_MODE = "0"
APP_URL = "https://manyarms.app"
ATPROTO_TASK_NSID = ""
# The people who approve new organizations, comma-separated. Set before the
# first deploy, or no organization can be approved.
ADMIN_EMAILS = ""
